[project]
name = "backend"
version = "0.1.0"
description = "Note Management backend: domain, application and adapters"
readme = "README.md"
authors = [
    { name = "Sree R One", email = "sreeraj_ec@hotmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.143.0",
    "mcp[cli]>=2.3.0",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
backend = "backend:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "import-linter>=2.15",
    "pyshacl>=0.40.1",
    "pytest>=9.1.1",
    "pytest-bdd>=9.0.0",
    "pytest-cov>=7.1.0",
    "rdflib>=7.6.0",
    "ruff>=0.17.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["ac(id): the acceptance criterion this test covers"]

[tool.ruff]
line-length = 88
target-version = "py314"
src = ["src", "tests"]

[tool.ruff.format]
docstring-code-format = true
